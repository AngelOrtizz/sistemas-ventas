<div class ="row justify-content-center pt-5">
  <div class="col col-lg-4">
    <mat-card appearance="filled">
      <mat-card-header>
        <mat-card-title>Login</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-form-field class="full-width pt-2 " appearance="outline">
          <mat-label>user</mat-label>
          <input matInput placeholder="Enter your user" />
        </mat-form-field>

        <mat-form-field class="full-width pt-2 " appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput  type="password" placeholder="Enter your Password" />
          <button matIconButton matSuffix>
            <mat-icon>visibility</mat-icon>
          </button>
        </mat-form-field>

        <button class="full-width" matButton="filled">
          Access
        </button>

        <button class="full-width mt-2" matButton="text">
            Forgot your password?
        </button>

      </mat-card-content>
    </mat-card>
  </div>
</div>
